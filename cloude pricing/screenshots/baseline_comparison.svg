<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <style> .title { font: bold 16px sans-serif } .label { font: 12px sans-serif } .axis { stroke:#333; stroke-width:1 } </style>
  <text x="20" y="24" class="title">Baseline Monthly Cost Comparison (USD)</text>
  <!-- axes -->
  <line x1="60" y1="360" x2="740" y2="360" class="axis" />
  <line x1="60" y1="60" x2="60" y2="360" class="axis" />
  <!-- bars: AWS 536, Azure Linux 532, Azure Windows 482 -->
  <!-- scale: max 600 -> height range 280 -->
  <!-- computed heights -->
  <rect x="120" y="360" width="120" height="-250" fill="#ff7f0e" transform="translate(0,0)" />
  <rect x="280" y="360" width="120" height="-248" fill="#1f77b4" transform="translate(0,0)" />
  <rect x="440" y="360" width="120" height="-225" fill="#2ca02c" transform="translate(0,0)" />
  <!-- labels -->
  <text x="180" y="380" class="label">AWS: $536</text>
  <text x="340" y="380" class="label">Azure Linux: $532</text>
  <text x="500" y="380" class="label">Azure Win+AHB: $482</text>
</svg>
